# Nginx reverse proxy in front of Gunicorn. Copy to
# /etc/nginx/sites-available/eyeconic, then:
#   sudo ln -s /etc/nginx/sites-available/eyeconic /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN.com below with your real domain before deploying.
# Run `sudo certbot --nginx -d YOUR_DOMAIN.com -d www.YOUR_DOMAIN.com`
# afterwards — it edits this file in place to add the HTTPS server block
# and redirect, so don't hand-write the SSL part yourself.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    client_max_body_size 20M;

    # Static files served directly by nginx — never touches Gunicorn/Python,
    # and browsers cache them for a year (app.py already sends long-lived
    # Cache-Control for /static/, this mirrors that at the nginx layer too).
    location /static/ {
        alias /home/ubuntu/eyeconic-eyewear-main/apps/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 500;
}
